# Integración continua: corre todos los tests en un servidor de GitHub en cada push y en cada
# pull request. Si algún test falla, el commit o el PR quedan marcados en rojo.
# Los tests de integración usan Testcontainers: los runners de Ubuntu ya traen Docker.
name: Tests

on:
  push:
  pull_request:

# Solo lectura del repositorio: el workflow no necesita escribir nada.
permissions:
  contents: read

# Si llega un push nuevo a la misma rama mientras corre el anterior, se cancela el viejo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ./mvnw test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Java 21 (con caché de dependencias de Maven)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Correr los tests
        run: ./mvnw -B test

      - name: Guardar los reportes de tests si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-tests
          path: target/surefire-reports/
          retention-days: 7

  # Verifica que los archivos de producción (deploy/) sigan funcionando: que la imagen compile y que
  # el Compose y el Caddyfile sean válidos. No despliega nada.
  imagen:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_USER: vidriera
      DB_PASSWORD: solo-para-validar
      VIDRIERA_DOMINIO_BASE: vidriera.test
      SUPERADMIN_EMAIL: admin@vidriera.test
      SUPERADMIN_PASSWORD: solo-para-validar
      ACME_EMAIL: admin@vidriera.test

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Construir la imagen de producción
        run: docker build -t vidriera-app .

      - name: Validar el Compose de producción
        run: docker compose -f deploy/docker-compose.prod.yml config --quiet

      - name: Validar el Caddyfile (con un certificado de prueba)
        run: |
          mkdir -p /tmp/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=vidriera.test" \
            -keyout /tmp/certs/origen-key.pem -out /tmp/certs/origen.pem
          docker run --rm -e VIDRIERA_DOMINIO_BASE -e ACME_EMAIL \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -v /tmp/certs:/certs:ro \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
