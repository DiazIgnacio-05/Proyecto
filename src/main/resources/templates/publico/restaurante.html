<!DOCTYPE html>
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${meta}, ${comercio})}"></head>
<body th:data-carrito="${comercio.slug}">

<th:block th:replace="~{fragments/sitio :: cabecera}"></th:block>

<nav class="categorias" aria-label="Secciones del menú">
    <div class="contenedor categorias__lista">
        <a th:each="seccion : ${secciones}" th:href="|#cat-${seccion.id}|" class="chip"
           th:text="${seccion.nombre}">Categoría</a>
        <a href="#info" class="chip">Horarios y contacto</a>
    </div>
</nav>

<main class="contenedor">
    <p th:if="${secciones.isEmpty()}" class="vacio">Pronto vas a ver el menú acá.</p>

    <section th:each="seccion : ${secciones}" th:id="|cat-${seccion.id}|" class="seccion">
        <h2 class="seccion__titulo" th:text="${seccion.nombre}">Categoría</h2>
        <ul class="productos">
            <li th:each="p : ${seccion.productos}" class="producto"
                th:classappend="${!p.sePuedePedir} ? 'producto--agotado'"
                th:attr="data-id=${p.id},data-nombre=${p.nombre},data-precio=${p.precio},data-pedible=${p.sePuedePedir}">
                <img th:if="${p.imagenUrl}" th:src="${p.imagenUrl}" alt="" class="producto__foto"
                     width="88" height="88" loading="lazy" decoding="async">
                <div class="producto__info">
                    <h3 class="producto__nombre">
                        <span th:text="${p.nombre}">Producto</span>
                        <span th:if="${p.destacado}" class="etiqueta">Recomendado</span>
                    </h3>
                    <p th:if="${p.descripcion}" class="producto__descripcion" th:text="${p.descripcion}"></p>
                    <p class="producto__precio" th:text="${@pesos.de(p.precio)}">$ 0</p>
                </div>
                <div class="producto__accion" data-accion-producto>
                    <span th:unless="${p.sePuedePedir}" class="etiqueta etiqueta--agotado">Sin stock</span>
                    <button th:if="${p.sePuedePedir}" type="button" class="boton boton--agregar"
                            data-accion="sumar" th:aria-label="|Agregar ${p.nombre}|">Agregar</button>
                </div>
            </li>
        </ul>
    </section>

    <section th:replace="~{fragments/sitio :: info}"></section>
</main>

<th:block th:replace="~{fragments/sitio :: pedido}"></th:block>
</body>
</html>
