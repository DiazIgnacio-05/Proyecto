<!DOCTYPE html>
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${comercio.nombre}">Comercio</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <style th:inline="css">
        :root { --color-primario: [[${comercio.apariencia.colorPrimario}]]; }
    </style>
</head>
<body>
<main class="contenedor">
    <h1 th:text="${comercio.nombre}">Comercio</h1>
    <p th:text="${comercio.rubro.etiqueta}">Rubro</p>
    <p>Sitio en construcción · <span th:text="${cantidadProductos}">0</span> productos cargados.</p>
</main>
</body>
</html>
