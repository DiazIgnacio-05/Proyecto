# Configuración común a todos los entornos.
# Los valores sensibles se leen de variables de entorno; en desarrollo, del archivo .env
# (que no se sube al repositorio). Ver .env.example.
spring:
  application:
    name: vidriera
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vidriera}
    username: ${DB_USER:vidriera}
    password: ${DB_PASSWORD:}
  jpa:
    # Sin "open session in view": las consultas se hacen en los servicios, no al renderizar la vista.
    open-in-view: false
    hibernate:
      # Hibernate no toca el esquema; solo verifica que las entidades coincidan con las tablas.
      # El esquema lo manejan las migraciones de Flyway (src/main/resources/db/migration).
      ddl-auto: validate
    properties:
      hibernate:
        # Al recorrer colecciones "lazy" (ej. variantes de cada producto), Hibernate las carga de a 50
        # en una sola consulta en vez de una consulta por producto (el problema "N+1").
        default_batch_fetch_size: 50
  flyway:
    locations: classpath:db/migration
  web:
    resources:
      # CSS y JS con un hash del contenido en el nombre (sitio-3f2a....css): el navegador los guarda
      # un año y, cuando cambia el archivo, cambia el nombre y se descarga la versión nueva.
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true
  servlet:
    multipart:
      # Fotos del celular: hasta 10 MB cada una (después se achican a unos 100-200 KB).
      max-file-size: 10MB
      max-request-size: 12MB

server:
  compression:
    enabled: true
  error:
    include-stacktrace: never

vidriera:
  dominio-base: ${VIDRIERA_DOMINIO_BASE:localhost}
  zona-horaria: America/Argentina/Catamarca
  super-admin:
    email: ${SUPERADMIN_EMAIL:}
    password: ${SUPERADMIN_PASSWORD:}
  imagenes:
    directorio: ${VIDRIERA_IMAGENES_DIR:./uploads}
