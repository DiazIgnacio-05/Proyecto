# Configuración común a todos los entornos.
# Los valores sensibles se leen de variables de entorno; en desarrollo, del archivo .env
# (que no se sube al repositorio). Ver .env.example.
spring:
  application:
    name: vidriera
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vidriera}
    username: ${DB_USER:vidriera}
    password: ${DB_PASSWORD:}
  jpa:
    # Sin "open session in view": las consultas se hacen en los servicios, no al renderizar la vista.
    open-in-view: false
    hibernate:
      # Hibernate no toca el esquema; solo verifica que las entidades coincidan con las tablas.
      # El esquema lo manejan las migraciones de Flyway (src/main/resources/db/migration).
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  compression:
    enabled: true
  error:
    include-stacktrace: never

vidriera:
  dominio-base: ${VIDRIERA_DOMINIO_BASE:localhost}
  zona-horaria: America/Argentina/Catamarca
  super-admin:
    email: ${SUPERADMIN_EMAIL:}
    password: ${SUPERADMIN_PASSWORD:}
